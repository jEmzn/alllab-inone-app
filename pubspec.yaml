    - lib/chapters/ch11/editor/screens/
    - lib/chapters/ch11/rebuild/providers/
    - lib/chapters/ch11/rebuild/screens/
    - lib/chapters/ch11/shop/models/
    - lib/chapters/ch11/shop/providers/
    - lib/chapters/ch11/shop/screens/
    - lib/chapters/ch12/models/
    - lib/chapters/ch12/providers/
    - lib/chapters/ch12/screens/
    - lib/chapters/ch12/services/
    - lib/chapters/ch13/exam_book/models/
    - lib/chapters/ch13/exam_book/providers/
    - lib/chapters/ch13/exam_book/screens/
    - lib/chapters/ch13/expense/models/
    - lib/chapters/ch13/expense/providers/
    - lib/chapters/ch13/expense/screens/
